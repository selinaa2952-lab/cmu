<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中國醫藥大學 教務處水湳校區辦公室配置圖（A4標準精準版）</title>
  <!-- 引入 html2canvas 支援一鍵截圖匯出 PNG 圖片 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      
      --color-reg: #1d4ed8;
      --color-reg-bg: #eff6ff;
      --color-adm: #b91c1c;
      --color-adm-bg: #fef2f2;
      --color-tch: #15803d;
      --color-tch-bg: #f0fdf4;
      --color-grd: #6d28d9;
      --color-grd-bg: #faf5ff;
      --color-dir: #b45309;
      --color-dir-bg: #fffbeb;
      --color-other: #475569;
      --color-other-bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    header {
      background: white;
      padding: 18px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }

    .title-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box input {
      padding: 8px 14px;
      width: 250px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
    }

    .btn {
      padding: 8px 15px;
      border-radius: 7px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-outline {
      background: white;
      border-color: var(--border-color);
      color: var(--text-main);
    }
    .btn-outline:hover {
      background: #edf2f7;
      border-color: #a0aec0;
    }
    .btn-color {
      background: #15803d;
      color: white;
    }
    .btn-color:hover {
      background: #166534;
    }
    .btn-mono {
      background: #0f172a;
      color: white;
    }
    .btn-mono:hover {
      background: #334155;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 600;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #1d4ed8;
    }

    .legend-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .legend-tag {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .instruction-bar {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* 辦公室地圖外框區域 */
    .office-map-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    .office-map {
      background: white;
      padding: 16px;
      border-radius: 8px;
      border: 2px solid #0f172a;
      width: 100%;
      min-width: 1320px;
      margin: 0 auto;
    }

    .map-header-bar {
      text-align: right;
      margin-bottom: 10px;
    }

    .counter-bar {
      display: inline-block;
      width: 40%;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 8px 0;
      font-weight: 800;
      letter-spacing: 6px;
      font-size: 1.05rem;
      border-radius: 6px 6px 0 0;
    }

    /* 10 欄 CSS Grid (固定比例分佈) */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 10px;
      align-items: stretch;
      width: 100%;
    }

    /* 左上方純淨灰色區塊 (跨 6 欄 x 跨 2 列) */
    .big-room {
      grid-column: 1 / span 6;
      grid-row: 1 / span 2;
      background: #f8fafc;
      border: 1.5px dashed #94a3b8;
      border-radius: 6px;
      min-height: 140px;
    }

    /* 合併跨欄座位 (教務長室 / 教務處總機) */
    .seat-span-2 {
      grid-column: span 2;
    }

    /* 座位卡片基礎設定 */
    .seat-card {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px 6px;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      position: relative;
      user-select: none;
      cursor: grab;
      transition: all 0.15s ease;
    }

    .seat-card:active {
      cursor: grabbing;
    }

    .seat-card:hover {
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      border-color: #1d4ed8;
      z-index: 5;
    }

    /* 拖曳狀態樣式 */
    .seat-card.dragging {
      opacity: 0.35;
      border: 2px dashed #1d4ed8;
    }

    .seat-card.drag-over {
      border: 2.5px dashed #15803d !important;
      background-color: #f0fdf4 !important;
    }

    /* 空座位 */
    .seat-card.empty-seat {
      background: #f8fafc;
      border: 1.5px dashed #cbd5e1;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .seat-card.empty-seat:hover {
      border-color: #1d4ed8;
      color: #1d4ed8;
      background: #eff6ff;
    }

    /* 卡片操作小工具列 */
    .card-actions-hover {
      position: absolute;
      top: 3px;
      right: 3px;
      display: none;
      gap: 2px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 1px 2px;
      z-index: 10;
    }

    .seat-card:hover .card-actions-hover {
      display: flex;
    }

    .mini-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 2px 4px;
      border-radius: 3px;
      color: #334155;
    }
    .mini-btn:hover {
      background: #f1f5f9;
      color: #1d4ed8;
    }

    /* 彩色組別邊框色彩 */
    .seat-card.dept-reg { border-top: 4px solid var(--color-reg); }
    .seat-card.dept-adm { border-top: 4px solid var(--color-adm); }
    .seat-card.dept-tch { border-top: 4px solid var(--color-tch); }
    .seat-card.dept-grd { border-top: 4px solid var(--color-grd); }
    .seat-card.dept-dir { border-top: 5px solid var(--color-dir); background: var(--color-dir-bg); }
    .seat-card.dept-cmu { border-top: 5px solid var(--color-dir); background: var(--color-dir-bg); }
    .seat-card.dept-other { border-top: 4px solid var(--color-other); }

    .card-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      margin-bottom: 4px;
      display: inline-block;
      width: fit-content;
      line-height: 1.2;
    }
    .dept-reg .card-badge { background: var(--color-reg-bg); color: var(--color-reg); }
    .dept-adm .card-badge { background: var(--color-adm-bg); color: var(--color-adm); }
    .dept-tch .card-badge { background: var(--color-tch-bg); color: var(--color-tch); }
    .dept-grd .card-badge { background: var(--color-grd-bg); color: var(--color-grd); }
    .dept-dir .card-badge { background: #fef3c7; color: #b45309; }
    .dept-cmu .card-badge { background: #fef3c7; color: #b45309; }
    .dept-other .card-badge { background: var(--color-other-bg); color: var(--color-other); }

    /* 姓名列排版：嚴格限制不換行 (white-space: nowrap) */
    .card-name-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 2px;
      margin-bottom: 3px;
      width: 100%;
      overflow: hidden;
    }

    .card-name {
      font-size: 0.98rem;
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap !important;
      word-break: keep-all !important;
      overflow: hidden;
      text-overflow: clip;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap !important;
      word-break: keep-all !important;
      font-weight: 600;
      flex-shrink: 1;
      overflow: hidden;
      text-align: right;
    }

    .card-ext {
      font-size: 0.8rem;
      font-weight: 700;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 2px;
      margin-bottom: 4px;
      white-space: nowrap;
    }

    /* 業務職掌區塊 */
    .card-desc {
      font-size: 0.72rem;
      color: #334155;
      line-height: 1.38;
      background: #f8fafc;
      padding: 4px 6px;
      border-radius: 4px;
      border-left: 2px solid #94a3b8;
      flex-grow: 1;
      word-break: break-all;
      white-space: normal;
    }

    .seat-span-2 .card-desc {
      background: #ffffff;
      border-left-color: #b45309;
    }

    /* ============================================================
       🔥【智能自適應排版：當「業務職掌」隱藏時放大字體並保證名字絕不斷行】🔥
       ============================================================ */
    body.hide-desc-mode .seat-card {
      min-height: 90px;
      padding: 8px 6px;
      justify-content: space-evenly;
    }
    body.hide-desc-mode .card-badge {
      font-size: 0.75rem;
      padding: 2px 5px;
      margin-bottom: 2px;
    }
    body.hide-desc-mode .card-name-row {
      margin-bottom: 2px;
    }
    body.hide-desc-mode .card-name {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      white-space: nowrap !important;
      word-break: keep-all !important;
    }
    body.hide-desc-mode .card-title {
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap !important;
    }
    body.hide-desc-mode .card-ext {
      font-size: 0.9rem;
      font-weight: 800;
      margin-bottom: 0px;
      white-space: nowrap;
    }
    body.hide-desc-mode .big-room {
      min-height: 130px;
    }

    /* 搜尋高亮 */
    .seat-card.search-match {
      border: 2.5px solid #b91c1c !important;
      background-color: #fffaf0 !important;
      transform: scale(1.02);
      z-index: 10;
    }

    .seat-card.search-dimmed {
      opacity: 0.2;
    }

    /* ============================================================
       🖨️【精準 A4 橫向比例滿版匯出設定 (297:210 嚴格對齊)】
       ============================================================ */
    .export-active-mode {
      background: #ffffff !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    .export-active-mode #captureArea {
      border: 2px solid #0f172a !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      padding: 10px !important;
      margin: 0 auto !important;
      width: 1485px !important;       /* 精確 A4 橫向比例 297:210 (1485 x 1050) */
      max-width: 1485px !important;
      min-width: 1485px !important;
      box-sizing: border-box !important;
    }
    .export-active-mode .card-actions-hover { display: none !important; }
    .export-active-mode .empty-seat span { display: none !important; }

    /* 彩色匯出模式：完全保持網頁原汁原味的色彩與設計元素 */
    .export-color-mode .seat-card {
      box-shadow: none !important;
    }

    /* 黑白高對比匯出模式專用微調 */
    .export-mono-mode #captureArea { border: 2.5px solid #000000 !important; }
    .export-mono-mode .counter-bar { background: #000000 !important; color: #ffffff !important; border: 2px solid #000000 !important; }
    .export-mono-mode .seat-card {
      background: #ffffff !important;
      border: 2px solid #000000 !important;
      border-top: 5px solid #000000 !important;
      box-shadow: none !important;
    }
    .export-mono-mode .seat-card.dept-dir, .export-mono-mode .seat-card.dept-cmu {
      border: 2.5px solid #000000 !important;
      border-top: 6px solid #000000 !important;
    }
    .export-mono-mode .card-badge {
      background: #ffffff !important;
      color: #000000 !important;
      border: 1px solid #000000 !important;
      font-weight: 800 !important;
    }
    .export-mono-mode .dept-dir .card-badge, .export-mono-mode .dept-cmu .card-badge {
      background: #000000 !important;
      color: #ffffff !important;
      border-color: #000000 !important;
    }
    .export-mono-mode .card-name { color: #000000 !important; font-weight: 900 !important; }
    .export-mono-mode .card-title { color: #334155 !important; font-weight: 700 !important; }
    .export-mono-mode .card-ext { color: #000000 !important; font-weight: 800 !important; }
    .export-mono-mode .card-desc {
      background: #ffffff !important;
      border: 1px solid #94a3b8 !important;
      border-left: 3.5px solid #000000 !important;
      color: #000000 !important;
      font-weight: 600 !important;
    }
    .export-mono-mode .empty-seat { background: #ffffff !important; border: 2px dashed #94a3b8 !important; }
    .export-mono-mode .big-room { background: #ffffff !important; border: 2px dashed #475569 !important; }

    /* 彈跳視窗 (Modal) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(3px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: white;
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      animation: modalFadeIn 0.2s ease-out;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-header {
      padding: 16px 22px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .modal-close-btn:hover { background: #e2e8f0; color: #1a202c; }
    .modal-body {
      padding: 22px;
      overflow-y: auto;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .modal-footer {
      padding: 14px 22px;
      background: #f8fafc;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full-width { grid-column: span 2; }
    .form-group label { font-weight: 600; font-size: 0.88rem; color: #4a5568; }
    .form-group input, .form-group select, .form-group textarea {
      padding: 8px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #3182ce; }
    .form-group textarea { resize: vertical; min-height: 90px; }

    /* 浮動即時同步狀態提示 (Toast) */
    .sync-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #f8fafc;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 200;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .sync-toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <div class="container">
    <!-- 頂部控制面板 -->
    <header>
      <div class="title-area">
        <h1>🏫 中國醫藥大學 教務處水湳校區辦公室配置圖</h1>
        <div class="top-actions">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 搜尋同仁、分機、業務..." oninput="handleSearch()">
          </div>
          <button class="btn btn-outline" onclick="resetToDefault()">🔄 還原預設</button>
          <!-- 匯出按鈕組合：彩色 PNG / 黑白 PNG / SVG 向量檔 -->
          <button class="btn btn-color" onclick="exportOfficeImage('color')" id="btnExportColor">🎨 匯出 A4 彩色圖</button>
          <button class="btn btn-mono" onclick="exportOfficeImage('mono')" id="btnExportMono">🖨️ 匯出 A4 黑白圖</button>
          <button class="btn" style="background:#4338ca; color:#fff;" onclick="exportOfficeSVG()" id="btnExportSvg">📐 匯出 A4 向量 SVG</button>
        </div>
      </div>

      <div class="controls-row">
        <!-- 顯示勾選框 -->
        <div class="checkbox-group">
          <span style="font-weight:800; color:#0f172a; margin-right:4px;">顯示選項：</span>
          <label class="checkbox-label"><input type="checkbox" id="chkDept" checked onchange="updateVisibility()"> 組別</label>
          <label class="checkbox-label"><input type="checkbox" id="chkName" checked onchange="updateVisibility()"> 姓名/職稱</label>
          <label class="checkbox-label"><input type="checkbox" id="chkExt" checked onchange="updateVisibility()"> 分機</label>
          <label class="checkbox-label"><input type="checkbox" id="chkDesc" onchange="updateVisibility()"> 業務職掌</label>
        </div>

        <!-- 圖例 -->
        <div class="legend-group">
          <span class="legend-tag" style="background:var(--color-reg-bg); color:var(--color-reg);">● 註冊課務組</span>
          <span class="legend-tag" style="background:var(--color-adm-bg); color:var(--color-adm);">● 招生組</span>
          <span class="legend-tag" style="background:var(--color-tch-bg); color:var(--color-tch);">● 教學組</span>
          <span class="legend-tag" style="background:var(--color-grd-bg); color:var(--color-grd);">● 研教組</span>
          <span class="legend-tag" style="background:#fef3c7; color:#b45309;">● 校本部 / 教務處</span>
        </div>
      </div>
    </header>

    <!-- 提示操作說明 -->
    <div class="instruction-bar">
      <span>💡 <strong>A4 滿版標準輸出：</strong> 比例嚴格鎖定 <strong>297 × 210 (A4 尺寸)</strong>。名字<strong>保證絕不斷行</strong>，彩色匯出與網頁設計元素<strong>100%完全一致</strong>！</span>
    </div>

    <!-- 辦公室地圖區域 (截圖匯出目標) -->
    <div class="office-map-wrapper">
      <div class="office-map" id="captureArea">
        <div class="map-header-bar">
          <div class="counter-bar">【 櫃 台 】</div>
        </div>

        <div class="grid-container" id="gridMap">
          <!-- JS 動態生成座位卡片與格局 -->
        </div>
      </div>
    </div>

    const GAS_URL = "https://script.google.com/macros/s/AKfycbxWc9rufEYtVtpsv8A5sxrQw39e6PiNVqge9OGMB0cWDzSe1-C3qf3z20N8ZNHdwoPn/exec";

    let currentLayout = [];
    let draggedKey = null;

    function getDeptClass(dept) {
      if (!dept) return "dept-other";
      if (dept.includes("註冊")) return "dept-reg";
      if (dept.includes("招生")) return "dept-adm";
      if (dept.includes("教學") && !dept.includes("雙語")) return "dept-tch";
      if (dept.includes("研教") || dept.includes("研究")) return "dept-grd";
      if (dept.includes("校本部") || dept.includes("長")) return "dept-dir";
      if (dept.includes("教務處")) return "dept-cmu";
      return "dept-other";
    }

    function initData() {
      const saved = localStorage.getItem("cmu_office_layout_v_perfect_a4");
      if (saved) {
        try {
          currentLayout = JSON.parse(saved);
        } catch (e) {
          currentLayout = JSON.parse(JSON.stringify(defaultOfficeLayout));
        }
      } else {
        currentLayout = JSON.parse(JSON.stringify(defaultOfficeLayout));
      }

      renderMap();
      fetchLatestFromGoogleSheet();
    }

    function saveData(actionDescription) {
      localStorage.setItem("cmu_office_layout_v_perfect_a4", JSON.stringify(currentLayout));
      syncToGoogleSheetAuto(actionDescription);
    }

    let toastTimeout = null;
    function showToast(icon, msg) {
      const toast = document.getElementById("syncToast");
      const toastIcon = document.getElementById("toastIcon");
      const toastMsg = document.getElementById("toastMsg");
      if (!toast) return;

      toastIcon.innerText = icon;
      toastMsg.innerText = msg;
      toast.classList.add("show");

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
      }, 3500);
    }

    let syncDebounceTimer = null;
    function syncToGoogleSheetAuto(actionDescription) {
      if (syncDebounceTimer) clearTimeout(syncDebounceTimer);

      syncDebounceTimer = setTimeout(() => {
        sendPayloadToGAS(actionDescription);
      }, 400);
    }

    function sendPayloadToGAS(actionDescription) {
      showToast("⏳", "正在同步至 Google 試算表...");
      const payload = JSON.stringify(currentLayout);

      const form = document.getElementById("gas_hidden_form");
      const dataInput = document.getElementById("gas_hidden_data");
      if (form && dataInput) {
        form.action = GAS_URL;
        dataInput.value = payload;
        form.submit();
      }

      try {
        const formData = new URLSearchParams();
        formData.append("data", payload);

        fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData.toString()
        }).then(() => {
          showToast("✅", (actionDescription || "資料已變更") + "，已成功同步至試算表！");
        }).catch(err => {
          showToast("✅", "已送出更新至試算表！");
        });
      } catch (e) {
        showToast("✅", "已透過表單寫入試算表！");
      }
    }

    function fetchLatestFromGoogleSheet() {
      fetch(GAS_URL)
        .then(res => res.json())
        .then(data => {
          if (Array.isArray(data) && data.length > 1) {
            let updated = 0;
            for (let i = 1; i < data.length; i++) {
              const row = data[i];
              const key = row[0];
              if (!key) continue;

              const idx = currentLayout.findIndex(s => s.key === key);
              if (idx !== -1) {
                const dept = row[1] || currentLayout[idx].dept;
                const name = row[2] || "";
                const title = row[3] || "";
                const ext = row[4] !== undefined && row[4] !== null ? String(row[4]) : "";
                const brief = row[5] || "";

                if (name === "" || name === "空位" || name === "空") {
                  currentLayout[idx] = {
                    key: key,
                    span: currentLayout[idx].span || 1,
                    type: "empty"
                  };
                } else {
                  currentLayout[idx] = {
                    key: key,
                    span: currentLayout[idx].span || 1,
                    dept: dept,
                    deptClass: getDeptClass(dept),
                    name: name,
                    title: title,
                    ext: ext,
                    brief: brief
                  };
                }
                updated++;
              }
            }
            localStorage.setItem("cmu_office_layout_v_perfect_a4", JSON.stringify(currentLayout));
            renderMap();
            showToast("🟢", `已成功載入 Google 試算表最新配置 (${updated} 席位)`);
          }
        })
        .catch(err => {
          console.warn("GAS GET Error, loaded local cache:", err);
        });
    }

    function renderMap() {
      const grid = document.getElementById("gridMap");
      grid.innerHTML = "";

      const bigRoom = document.createElement("div");
      bigRoom.className = "big-room";
      grid.appendChild(bigRoom);

      currentLayout.forEach((seat) => {
        const card = document.createElement("div");
        card.setAttribute("data-key", seat.key);
        card.setAttribute("draggable", "true");

        const spanClass = seat.span === 2 ? "seat-span-2" : "";

        card.addEventListener("dragstart", handleDragStart);
        card.addEventListener("dragover", handleDragOver);
        card.addEventListener("dragleave", handleDragLeave);
        card.addEventListener("drop", handleDrop);
        card.addEventListener("dragend", handleDragEnd);

        if (!seat || seat.type === "empty" || !seat.name) {
          card.className = `seat-card empty-seat ${spanClass}`;
          card.id = `seat-${seat.key}`;
          card.innerHTML = `<span>➕ 點擊新增席位</span>`;
          card.onclick = () => openEditModal(seat.key, true);
        } else {
          card.className = `seat-card ${seat.deptClass || getDeptClass(seat.dept)} ${spanClass}`;
          card.id = `seat-${seat.key}`;

          card.innerHTML = `
            <div class="card-actions-hover">
              <button class="mini-btn" title="編輯資料" onclick="event.stopPropagation(); openEditModal('${seat.key}', false)">✏️</button>
              <button class="mini-btn del-btn" title="清空席位" onclick="event.stopPropagation(); quickDelete('${seat.key}')">🗑️</button>
            </div>
            <span class="card-badge item-dept">${seat.dept || '未設定'}</span>
            <div class="card-name-row item-name">
              <span class="card-name">${seat.name}</span>
              <span class="card-title">${seat.title || ''}</span>
            </div>
            <div class="card-ext item-ext">📞 #${seat.ext || '-'}</div>
            <div class="card-desc item-desc">${seat.brief || '暫無職掌'}</div>
          `;
          card.onclick = () => openEditModal(seat.key, false);
        }
        grid.appendChild(card);
      });

      updateVisibility();
    }

    function handleDragStart(e) {
      draggedKey = this.getAttribute("data-key");
      this.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      this.classList.add("drag-over");
    }

    function handleDragLeave(e) {
      this.classList.remove("drag-over");
    }

    function handleDrop(e) {
      e.stopPropagation();
      this.classList.remove("drag-over");
      const targetKey = this.getAttribute("data-key");

      if (draggedKey && targetKey && draggedKey !== targetKey) {
        const srcIdx = currentLayout.findIndex(s => s.key === draggedKey);
        const tgtIdx = currentLayout.findIndex(s => s.key === targetKey);

        if (srcIdx !== -1 && tgtIdx !== -1) {
          const srcSeat = { ...currentLayout[srcIdx] };
          const tgtSeat = { ...currentLayout[tgtIdx] };

          const srcKey = srcSeat.key;
          const srcSpan = srcSeat.span;
          const tgtKey = tgtSeat.key;
          const tgtSpan = tgtSeat.span;

          currentLayout[srcIdx] = { ...tgtSeat, key: srcKey, span: srcSpan };
          currentLayout[tgtIdx] = { ...srcSeat, key: tgtKey, span: tgtSpan };

          const srcName = srcSeat.name || "空位";
          const tgtName = tgtSeat.name || "空位";

          saveData(`【${srcName}】與【${tgtName}】位置已交換`);
          renderMap();
        }
      }
    }

    function handleDragEnd(e) {
      this.classList.remove("dragging");
      document.querySelectorAll(".seat-card").forEach(el => el.classList.remove("drag-over"));
      draggedKey = null;
    }

    // === 控制各欄位顯示/隱藏與自適應字體切換 ===
    function updateVisibility() {
      const showDept = document.getElementById("chkDept").checked;
      const showName = document.getElementById("chkName").checked;
      const showExt = document.getElementById("chkExt").checked;
      const showDesc = document.getElementById("chkDesc").checked;

      // 當業務職掌隱藏時，替 body 加入特定 class 觸發大字體自適應排版
      if (!showDesc) {
        document.body.classList.add("hide-desc-mode");
      } else {
        document.body.classList.remove("hide-desc-mode");
      }

      document.querySelectorAll(".item-dept").forEach(el => el.style.display = showDept ? "inline-block" : "none");
      document.querySelectorAll(".item-name").forEach(el => el.style.display = showName ? "flex" : "none");
      document.querySelectorAll(".item-ext").forEach(el => el.style.display = showExt ? "flex" : "none");
      document.querySelectorAll(".item-desc").forEach(el => el.style.display = showDesc ? "block" : "none");
    }

    function handleSearch() {
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
      
      currentLayout.forEach((seat) => {
        const card = document.getElementById(`seat-${seat.key}`);
        if (!card) return;

        if (!keyword) {
          card.classList.remove("search-match", "search-dimmed");
          return;
        }

        if (seat.type === "empty" || !seat.name) {
          card.classList.add("search-dimmed");
          return;
        }

        const match = 
          (seat.name && seat.name.toLowerCase().includes(keyword)) ||
          (seat.ext && seat.ext.toLowerCase().includes(keyword)) ||
          (seat.dept && seat.dept.toLowerCase().includes(keyword)) ||
          (seat.brief && seat.brief.toLowerCase().includes(keyword));

        if (match) {
          card.classList.add("search-match");
          card.classList.remove("search-dimmed");
        } else {
          card.classList.remove("search-match");
          card.classList.add("search-dimmed");
        }
      });
    }

    function openEditModal(key, isNew) {
      document.getElementById("editSeatKey").value = key;
      document.getElementById("editModalTitle").innerText = isNew ? "➕ 新增人員席位" : "✏️ 編輯人員與職掌資料";
      
      const seat = currentLayout.find(s => s.key === key) || {};

      document.getElementById("editDept").value = seat.dept || "校本部";
      document.getElementById("editName").value = seat.name || "";
      document.getElementById("editTitle").value = seat.title || "";
      document.getElementById("editExt").value = seat.ext || "";
      document.getElementById("editBrief").value = seat.brief || "";

      document.getElementById("editModal").classList.add("active");
    }

    function closeEditModal() {
      document.getElementById("editModal").classList.remove("active");
    }

    function submitEditForm() {
      const key = document.getElementById("editSeatKey").value;
      const dept = document.getElementById("editDept").value;
      const name = document.getElementById("editName").value.trim();
      
      if (!name) {
        alert("請填寫姓名！");
        return;
      }

      const idx = currentLayout.findIndex(s => s.key === key);
      if (idx !== -1) {
        const oldSpan = currentLayout[idx].span || 1;
        currentLayout[idx] = {
          key: key,
          span: oldSpan,
          dept: dept,
          deptClass: getDeptClass(dept),
          name: name,
          title: document.getElementById("editTitle").value.trim(),
          ext: document.getElementById("editExt").value.trim(),
          brief: document.getElementById("editBrief").value.trim()
        };

        saveData(`【${name}】資料已更新`);
        renderMap();
        closeEditModal();
      }
    }

    function deleteSeatData() {
      const key = document.getElementById("editSeatKey").value;
      if (confirm("確定要清空此席位資料嗎？")) {
        const idx = currentLayout.findIndex(s => s.key === key);
        if (idx !== -1) {
          const oldSpan = currentLayout[idx].span || 1;
          const oldName = currentLayout[idx].name || "席位";
          currentLayout[idx] = {
            key: key,
            span: oldSpan,
            type: "empty"
          };
          saveData(`【${oldName}】席位已清空`);
          renderMap();
          closeEditModal();
        }
      }
    }

    function quickDelete(key) {
      const seat = currentLayout.find(s => s.key === key);
      if (seat && confirm(`確定要清空【${seat.name}】的席位資料嗎？`)) {
        const idx = currentLayout.findIndex(s => s.key === key);
        if (idx !== -1) {
          const oldSpan = currentLayout[idx].span || 1;
          const oldName = seat.name;
          currentLayout[idx] = {
            key: key,
            span: oldSpan,
            type: "empty"
          };
          saveData(`【${oldName}】席位已清空`);
          renderMap();
        }
      }
    }

    
    // === 📐【匯出純向量 SVG 檔 (向量無失真、支援 Illustrator/Word/列印編輯)】===
    function exportOfficeSVG() {
      const showDept = document.getElementById("chkDept").checked;
      const showName = document.getElementById("chkName").checked;
      const showExt = document.getElementById("chkExt").checked;
      const showDesc = document.getElementById("chkDesc").checked;

      // 標準 A4 橫向尺寸 297 x 210 mm -> 轉換為 1485 x 1050 像素畫布
      const svgWidth = 1485;
      const svgHeight = 1050;
      const padding = 20;

      // 建立 SVG 根標籤
      let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${svgWidth} ${svgHeight}" width="${svgWidth}" height="${svgHeight}">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .map-border { fill: #ffffff; stroke: #0f172a; stroke-width: 2.5; }
      .counter-bg { fill: #0f172a; }
      .counter-text { fill: #ffffff; font-family: sans-serif; font-size: 16px; font-weight: bold; letter-spacing: 6px; text-anchor: middle; }
      .room-bg { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .card-rect { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 6px; ry: 6px; }
      .card-empty { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4,4; rx: 6px; ry: 6px; }
      .card-name { fill: #0f172a; font-family: sans-serif; font-size: ${showDesc ? '15px' : '19px'}; font-weight: bold; }
      .card-title { fill: #64748b; font-family: sans-serif; font-size: ${showDesc ? '11px' : '12px'}; font-weight: bold; text-anchor: end; }
      .card-ext { fill: #334155; font-family: sans-serif; font-size: ${showDesc ? '12px' : '14px'}; font-weight: bold; }
      .card-desc { fill: #334155; font-family: sans-serif; font-size: 11px; line-height: 1.35; }
      .badge-text { font-family: sans-serif; font-size: 11px; font-weight: bold; }
    </style>
  </defs>
  <!-- 背景與外框 -->
  <rect class="bg" width="${svgWidth}" height="${svgHeight}"/>
  <rect class="map-border" x="${padding}" y="${padding}" width="${svgWidth - padding * 2}" height="${svgHeight - padding * 2}" rx="8"/>
  
  <!-- 櫃台區域 -->
  <rect class="counter-bg" x="${svgWidth - padding - 560}" y="${padding}" width="560" height="38" rx="4"/>
  <text class="counter-text" x="${svgWidth - padding - 280}" y="${padding + 25}">【 櫃 台 】</text>
`;

      const mapX = padding + 15;
      const mapY = padding + 50;
      const mapW = svgWidth - padding * 2 - 30;
      const mapH = svgHeight - padding * 2 - 65;

      const cols = 10;
      const colGap = 10;
      const rowGap = 12;
      const cardW = (mapW - colGap * (cols - 1)) / cols; // ~140px

      // 4 排高度比例
      const rows = 4;
      const cardH = (mapH - rowGap * (rows - 1)) / rows; // ~210px

      // 組別色彩設定
      const deptColors = {
        "註冊課務組": { top: "#1d4ed8", bg: "#eff6ff", text: "#1d4ed8" },
        "招生組": { top: "#b91c1c", bg: "#fef2f2", text: "#b91c1c" },
        "教學組": { top: "#15803d", bg: "#f0fdf4", text: "#15803d" },
        "研教組": { top: "#6d28d9", bg: "#faf5ff", text: "#6d28d9" },
        "校本部": { top: "#b45309", bg: "#fef3c7", text: "#b45309", cardBg: "#fffbeb" },
        "教務處": { top: "#b45309", bg: "#fef3c7", text: "#b45309", cardBg: "#fffbeb" },
        "其他": { top: "#475569", bg: "#f8fafc", text: "#475569" }
      };

      // 1. 左上角大房間 (6 欄 x 2 列)
      const bigRoomW = cardW * 6 + colGap * 5;
      const bigRoomH = cardH * 2 + rowGap;
      svg += `  <rect class="room-bg" x="${mapX}" y="${mapY}" width="${bigRoomW}" height="${bigRoomH}"/>
`;

      // 2. 渲染各座位卡片
      currentLayout.forEach(seat => {
        let r, c;
        if (seat.key.startsWith("r1_")) r = 0;
        else if (seat.key.startsWith("r2_")) r = 1;
        else if (seat.key.startsWith("r3_")) r = 2;
        else if (seat.key.startsWith("r4_")) r = 3;

        const colMatch = seat.key.match(/c(\d+)/);
        c = colMatch ? parseInt(colMatch[1]) - 1 : 0;

        const span = seat.span || 1;
        const x = mapX + c * (cardW + colGap);
        const y = mapY + r * (cardH + rowGap);
        const w = cardW * span + colGap * (span - 1);
        const h = cardH;

        if (seat.type === "empty" || !seat.name) {
          svg += `  <rect class="card-empty" x="${x}" y="${y}" width="${w}" height="${h}"/>
`;
          return;
        }

        const colorCfg = deptColors[seat.dept] || deptColors["其他"];
        const cardBg = colorCfg.cardBg || "#ffffff";

        // 卡片主體
        svg += `  <g id="seat-${seat.key}">
`;
        svg += `    <rect class="card-rect" x="${x}" y="${y}" width="${w}" height="${h}" fill="${cardBg}"/>
`;
        // 頂部彩色邊框線
        svg += `    <path d="M ${x} ${y+5} Q ${x} ${y} ${x+5} ${y} L ${x+w-5} ${y} Q ${x+w} ${y} ${x+w} ${y+5} L ${x+w} ${y+5} L ${x} ${y+5} Z" fill="${colorCfg.top}"/>
`;

        let curY = y + 18;

        // 組別標籤
        if (showDept && seat.dept) {
          const badgeText = seat.dept;
          const badgeW = badgeText.length * 13 + 12;
          svg += `    <rect x="${x + 8}" y="${curY}" width="${badgeW}" height="18" rx="3" fill="${colorCfg.bg}"/>
`;
          svg += `    <text class="badge-text" x="${x + 14}" y="${curY + 13}" fill="${colorCfg.text}">${badgeText}</text>
`;
          curY += 24;
        }

        // 姓名與職稱
        if (showName) {
          svg += `    <text class="card-name" x="${x + 8}" y="${curY + 14}">${seat.name || ''}</text>
`;
          if (seat.title) {
            svg += `    <text class="card-title" x="${x + w - 8}" y="${curY + 14}">${seat.title}</text>
`;
          }
          curY += 22;
        }

        // 分機
        if (showExt && seat.ext) {
          svg += `    <text class="card-ext" x="${x + 8}" y="${curY + 12}">📞 #${seat.ext}</text>
`;
          curY += 18;
        }

        // 業務職掌
        if (showDesc && seat.brief) {
          const descX = x + 8;
          const descW = w - 16;
          const descH = h - (curY - y) - 8;
          
          svg += `    <rect x="${descX}" y="${curY}" width="${descW}" height="${descH}" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
`;
          svg += `    <line x1="${descX}" y1="${curY}" x2="${descX}" y2="${curY + descH}" stroke="${colorCfg.top}" stroke-width="2.5"/>
`;

          // 文字換行拆解
          const text = seat.brief;
          const charsPerLine = Math.floor(descW / 12);
          let textY = curY + 14;
          for (let i = 0; i < text.length; i += charsPerLine) {
            if (textY > curY + descH - 4) break;
            const line = text.substring(i, i + charsPerLine);
            svg += `    <text class="card-desc" x="${descX + 6}" y="${textY}">${line}</text>
`;
            textY += 15;
          }
        }

        svg += `  </g>
`;
      });

      svg += `</svg>`;

      // 產生 SVG 下載
      const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
      const downloadLink = document.createElement("a");
      const dateStr = new Date().toISOString().slice(0, 10);
      downloadLink.href = URL.createObjectURL(blob);
      downloadLink.download = `中國醫藥大學_教務處辦公室配置圖_A4向量版_${dateStr}.svg`;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
      URL.revokeObjectURL(downloadLink.href);
    }

    // === 🔥【嚴格 A4 (297:210) 比例、字體不折行、色彩 100% 一致之滿版匯出】🔥 ===
    function exportOfficeImage(mode) {
      const btnColor = document.getElementById("btnExportColor");
      const btnMono = document.getElementById("btnExportMono");
      const isMono = (mode === 'mono');

      const activeBtn = isMono ? btnMono : btnColor;
      const originalText = activeBtn.innerHTML;
      activeBtn.innerHTML = "⏳ 生成 A4 圖片中...";
      btnColor.disabled = true;
      btnMono.disabled = true;

      const targetElement = document.getElementById("captureArea");
      
      // 確保欄位顯示狀態正確套用
      updateVisibility();

      // 套用 A4 滿版匯出專用 CSS
      document.body.classList.add("export-active-mode");
      if (isMono) {
        document.body.classList.add("export-mono-mode");
      } else {
        document.body.classList.add("export-color-mode");
      }

      setTimeout(() => {
        // 標準 A4 橫向比例：寬 1485px，高 1050px (精確 297 : 210 = 1.4142857)
        const a4Width = 1485;
        const a4Height = Math.round(a4Width * (210 / 297)); // 1050px

        html2canvas(targetElement, {
          scale: 2.0,                  // 2倍清晰輸出
          backgroundColor: "#ffffff",
          useCORS: true,
          logging: false,
          scrollY: 0,
          scrollX: 0,
          width: a4Width,
          height: a4Height,
          windowWidth: 1650
        }).then(canvas => {
          const imageURL = canvas.toDataURL("image/png");
          const downloadLink = document.createElement("a");
          const dateStr = new Date().toISOString().slice(0, 10);
          const typeName = isMono ? "A4滿版黑白列印版" : "A4滿版彩色版";
          downloadLink.href = imageURL;
          downloadLink.download = `中國醫藥大學_教務處辦公室配置圖_${typeName}_${dateStr}.png`;
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);

          // 復原畫面狀態
          document.body.classList.remove("export-active-mode", "export-mono-mode", "export-color-mode");
          activeBtn.innerHTML = originalText;
          btnColor.disabled = false;
          btnMono.disabled = false;
        }).catch(err => {
          document.body.classList.remove("export-active-mode", "export-mono-mode", "export-color-mode");
          alert("截圖匯出失敗，請稍候重試。");
          console.error(err);
          activeBtn.innerHTML = originalText;
          btnColor.disabled = false;
          btnMono.disabled = false;
        });
      }, 150);
    }

    function resetToDefault() {
      if (confirm("⚠️ 確定要重設並還原回原始的預設配置嗎？所有手動修改與移動紀錄將被重置。")) {
        localStorage.removeItem("cmu_office_layout_v_perfect_a4");
        currentLayout = JSON.parse(JSON.stringify(defaultOfficeLayout));
        renderMap();
        saveData("已還原預設配置");
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeEditModal();
      }
    });

    window.onload = initData;
  </script>
