<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>組織架構圖產生器 (多圖示彈窗挑選版)</title>
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- FontAwesome 6 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
    body { background-color: #eef2f6; padding: 30px 20px; color: #334155; }

    /* 控制面板區 */
    .control-panel {
      max-width: 1200px;
      margin: 0 auto 30px auto;
      background: #ffffff;
      padding: 24px 30px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .panel-header h2 { font-size: 19px; color: #1e293b; display: flex; align-items: center; gap: 8px; }
    .btn-export {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(37,99,235,0.25);
      transition: all 0.2s ease;
    }
    .btn-export:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(37,99,235,0.35); }

    .input-row {
      display: grid;
      grid-template-columns: 80px 1fr 1fr 2fr;
      gap: 12px;
      margin-bottom: 18px;
      align-items: end;
    }
    .input-row label {
      font-size: 12px;
      font-weight: bold;
      color: #64748b;
      margin-bottom: 4px;
      display: block;
    }
    .input-row input {
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
      background: #f8fafc;
    }
    .input-row input:focus { outline: none; border-color: #3b82f6; background: #fff; }

    /* 圖示按鈕 (點擊開彈窗) */
    .icon-picker-btn {
      width: 44px;
      height: 38px;
      background: #eff6ff;
      border: 1.5px solid #bfdbfe;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #2563eb;
      font-size: 16px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .icon-picker-btn:hover { background: #dbeafe; border-color: #3b82f6; transform: scale(1.05); }

    /* 各組編輯卡片 */
    .groups-editor {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }
    .group-edit-card {
      background: #f8fafc;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .group-edit-header {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .group-edit-header input.name-input {
      flex: 1;
      font-weight: bold;
    }
    .group-edit-card input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12px;
      background: #fff;
    }

    /* 細項業務編輯列表 */
    .items-edit-container {
      max-height: 270px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }
    .item-edit-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .item-edit-row .icon-picker-btn {
      width: 34px;
      height: 30px;
      font-size: 13px;
    }
    .item-edit-row input.item-text-input { flex: 1; }
    .btn-del {
      background: #fee2e2;
      color: #ef4444;
      border: 1px solid #fecaca;
      padding: 6px 9px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
    }
    .btn-del:hover { background: #fca5a5; color: #fff; }
    .btn-add-item {
      background: #e2e8f0;
      border: none;
      padding: 7px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      color: #334155;
      font-weight: 600;
      margin-top: 4px;
    }
    .btn-add-item:hover { background: #cbd5e1; }

    /* ================= 圖示挑選彈窗 (Icon Picker Modal) ================= */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      backdrop-filter: blur(3px);
    }
    .modal-content {
      background: #ffffff;
      border-radius: 16px;
      width: 90%;
      max-width: 620px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .modal-header h3 { font-size: 17px; color: #1e293b; }
    .btn-close-modal { background: none; border: none; font-size: 20px; cursor: pointer; color: #94a3b8; }
    .btn-close-modal:hover { color: #334155; }
    
    .category-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
    }
    .cat-btn {
      background: #f1f5f9;
      border: none;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      color: #475569;
      font-weight: 600;
    }
    .cat-btn.active { background: #2563eb; color: #fff; }

    .icon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
      gap: 10px;
      max-height: 320px;
      overflow-y: auto;
      padding: 6px 2px;
    }
    .icon-option-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 4px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .icon-option-card:hover {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #2563eb;
      transform: translateY(-2px);
    }
    .icon-option-card i { font-size: 20px; }
    .icon-option-card span { font-size: 11px; color: #64748b; }

    /* ================= 組織架構圖繪製區 ================= */
    .canvas-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      overflow-x: auto;
      background: #eef2f6;
      display: flex;
      justify-content: center;
    }

    #org_chart {
      width: 1160px;
      background: #ffffff;
      padding: 40px 45px 35px 45px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      box-sizing: border-box;
      position: relative;
    }

    .chart-title {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      color: #243c68;
      letter-spacing: 6px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }
    .chart-title .line {
      display: inline-block;
      width: 45px;
      height: 3px;
      background: #cbd5e1;
      border-radius: 2px;
    }

    .top-node-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 0px;
    }
    .top-node {
      background: #ffffff;
      border: 1.8px solid #dbeafe;
      padding: 10px 32px;
      border-radius: 35px;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.08);
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: #fff;
    }
    .top-node .icon-box {
      width: 46px;
      height: 46px;
      background: #eff6ff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #2563eb;
    }
    .top-node .text-box { text-align: left; }
    .top-node .text-box h3 { font-size: 20px; color: #1e3a8a; font-weight: 700; margin-bottom: 2px; }
    .top-node .text-box p { font-size: 12.5px; color: #64748b; font-weight: 500; }

    /* SVG 連接線 */
    .connector-svg-container {
      width: 100%;
      height: 60px;
      display: block;
    }

    /* 4 組卡片容器 */
    .groups-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
      align-items: start;
    }
    .group-card {
      border-radius: 16px;
      border: 1.5px solid;
      padding: 0 16px 20px 16px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 卡片懸浮圖示 (優雅單色立體圓) */
    .group-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      margin-top: -28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }

    .group-header {
      text-align: center;
      margin: 12px 0 12px 0;
      width: 100%;
    }
    .group-header-badge {
      display: inline-block;
      padding: 5px 16px;
      border-radius: 20px;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 5px;
    }
    .group-sub-title {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.25;
      min-height: 28px;
    }

    .items-list {
      width: 100%;
      border-top: 1px dashed #cbd5e1;
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .item-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 12.5px;
      font-weight: 500;
      color: #334155;
      line-height: 1.4;
    }
    .item-row i {
      font-size: 12.5px;
      width: 16px;
      margin-top: 2px;
      text-align: center;
      flex-shrink: 0;
    }

    .chart-footer {
      margin-top: 35px;
      padding-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 13.5px;
      color: #334155;
      font-weight: 600;
    }
    .chart-footer i { color: #f59e0b; font-size: 18px; }

    /* 主題色系樣式 */
    .theme-blue { border-color: #bfdbfe; background: linear-gradient(180deg, #f0f7ff 0%, #ffffff 22%); }
    .theme-blue .group-icon, .theme-blue .group-header-badge { background: #3b82f6; }
    .theme-blue .group-sub-title, .theme-blue .item-row i { color: #2563eb; }

    .theme-green { border-color: #bbf7d0; background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 22%); }
    .theme-green .group-icon, .theme-green .group-header-badge { background: #22c55e; }
    .theme-green .group-sub-title, .theme-green .item-row i { color: #16a34a; }

    .theme-purple { border-color: #e9d5ff; background: linear-gradient(180deg, #faf5ff 0%, #ffffff 22%); }
    .theme-purple .group-icon, .theme-purple .group-header-badge { background: #8b5cf6; }
    .theme-purple .group-sub-title, .theme-purple .item-row i { color: #7c3aed; }

    .theme-orange { border-color: #fed7aa; background: linear-gradient(180deg, #fff7ed 0%, #ffffff 22%); }
    .theme-orange .group-icon, .theme-orange .group-header-badge { background: #f97316; }
    .theme-orange .group-sub-title, .theme-orange .item-row i { color: #ea580c; }
  </style>
</head>
<body>

  <!-- 控制面板 -->
  <div class="control-panel">
    <div class="panel-header">
      <h2>⚙️ 組織架構資料編輯器 (點擊圖示按鈕即可挑選)</h2>
      <button class="btn-export" onclick="exportToImage()">
        <i class="fa-solid fa-download"></i> 匯出高清組織架構圖 (PNG)
      </button>
    </div>
    
    <div class="input-row">
      <div>
        <label>處室圖示：</label>
        <button class="icon-picker-btn" id="btn-top-icon" onclick="openIconPicker('top')">
          <i class="fa-solid fa-building-columns"></i>
        </button>
      </div>
      <div>
        <label>處室名稱：</label>
        <input type="text" id="ipt-top-name" value="教務處" oninput="updateChart()">
      </div>
      <div>
        <label>英文名稱：</label>
        <input type="text" id="ipt-top-en" value="Office of Academic Affairs" oninput="updateChart()">
      </div>
      <div>
        <label>底部標語/備註：</label>
        <input type="text" id="ipt-footer-text" value="本處各組分工合作，致力於提升教學品質與學生學習成效，實踐卓越的教育服務。" oninput="updateChart()">
      </div>
    </div>

    <!-- 各組編輯欄位 -->
    <div class="groups-editor" id="groups-editor-container"></div>
  </div>

  <!-- 圖示選擇器彈窗 (Modal) -->
  <div class="modal-overlay" id="iconModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🎨 選擇圖示 (依業務分類)</h3>
        <button class="btn-close-modal" onclick="closeIconPicker()">✕</button>
      </div>

      <!-- 分類標籤 -->
      <div class="category-tabs" id="categoryTabs"></div>

      <!-- 圖示九宮格 -->
      <div class="icon-grid" id="iconGrid"></div>
    </div>
  </div>

  <!-- 組織圖展示與擷取區域 -->
  <div class="canvas-wrapper">
    <div id="org_chart">
      <div class="chart-title">
        <div class="line"></div> 組 織 架 構 <div class="line"></div>
      </div>

      <!-- 頂部處室卡片 -->
      <div class="top-node-wrapper">
        <div class="top-node">
          <div class="icon-box" id="view-top-icon">
            <i class="fa-solid fa-building-columns"></i>
          </div>
          <div class="text-box">
            <h3 id="view-top-name">教務處</h3>
            <p id="view-top-en">(Office of Academic Affairs)</p>
          </div>
        </div>
      </div>

      <!-- SVG 精準連接線 -->
      <svg class="connector-svg-container" viewBox="0 0 1070 60" preserveAspectRatio="none">
        <line x1="535" y1="0" x2="535" y2="30" stroke="#94a3b8" stroke-width="2" />
        <line x1="133.75" y1="30" x2="936.25" y2="30" stroke="#94a3b8" stroke-width="2" />
        <line x1="133.75" y1="30" x2="133.75" y2="60" stroke="#94a3b8" stroke-width="2" />
        <line x1="401.25" y1="30" x2="401.25" y2="60" stroke="#94a3b8" stroke-width="2" />
        <line x1="668.75" y1="30" x2="668.75" y2="60" stroke="#94a3b8" stroke-width="2" />
        <line x1="936.25" y1="30" x2="936.25" y2="60" stroke="#94a3b8" stroke-width="2" />
      </svg>

      <!-- 4 組卡片容器 -->
      <div class="groups-container" id="groups-container"></div>

      <!-- 底部標語 -->
      <div class="chart-footer">
        <i class="fa-regular fa-lightbulb"></i>
        <span id="view-footer-text">本處各組分工合作，致力於提升教學品質與學生學習成效，實踐卓越的教育服務。</span>
      </div>
    </div>
  </div>

  <script>

   const iconLibrary = {

        en: 'Graduate Academic Affairs Division',
        items: [
          { icon: 'fa-address-card', text: '研究所教務相關業務' },
          { icon: 'fa-user-check', text: '預修生甄選' },
          { icon: 'fa-graduation-cap', text: '逕修讀博士班甄選' },
          { icon: 'fa-sack-dollar', text: '研究生獎助金' },
          { icon: 'fa-users', text: '研究生教學助理TA' },
          { icon: 'fa-book-open', text: '校級課程規劃與推動' }
        ]
      },
      {
        theme: 'theme-orange',
        icon: 'fa-users',
        name: '招生組',
        en: 'Admissions Division',
        items: [
          { icon: 'fa-bullhorn', text: '大學繁星推薦' },
          { icon: 'fa-bullhorn', text: '大學申請入學' },
          { icon: 'fa-bullhorn', text: '大學分發入學' },
          { icon: 'fa-bullhorn', text: '四技二專聯合甄選' },
          { icon: 'fa-user-check', text: '身心障礙學生申請入學' },
          { icon: 'fa-award', text: '運動績優生甄試' },
          { icon: 'fa-graduation-cap', text: '碩士班甄試招生' },
          { icon: 'fa-graduation-cap', text: '博士班甄試招生' },
          { icon: 'fa-bullhorn', text: '國內招生宣傳' }
        ]
      }
    ];

    // 當前挑選圖示的目標
    let pickerTarget = null; // { type: 'top' | 'group' | 'item', gIdx, iIdx }

    function init() {
      initModalCategories();
      renderEditor();
      renderChart();
    }

    // 建立彈窗分類與圖示九宮格
    function initModalCategories() {
      const tabs = document.getElementById('categoryTabs');
      tabs.innerHTML = '';
      const categories = Object.keys(iconLibrary);

      categories.forEach((cat, idx) => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${idx === 0 ? 'active' : ''}`;
        btn.textContent = cat;
        btn.onclick = () => {
          document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderModalIcons(cat);
        };
        tabs.appendChild(btn);
      });

      renderModalIcons(categories[0]);
    }

    function renderModalIcons(category) {
      const grid = document.getElementById('iconGrid');
      grid.innerHTML = '';
      const icons = iconLibrary[category] || [];

      icons.forEach(item => {
        const card = document.createElement('div');
        card.className = 'icon-option-card';
        card.innerHTML = `<i class="fa-solid ${item.icon}"></i><span>${item.label}</span>`;
        card.onclick = () => selectIcon(item.icon);
        grid.appendChild(card);
      });
    }

    // 開啟與關閉彈窗
    function openIconPicker(type, gIdx = null, iIdx = null) {
      pickerTarget = { type, gIdx, iIdx };
      document.getElementById('iconModal').style.display = 'flex';
    }

    function closeIconPicker() {
      document.getElementById('iconModal').style.display = 'none';
      pickerTarget = null;
    }

    // 選中圖示回填
    function selectIcon(iconClass) {
      if (!pickerTarget) return;

      if (pickerTarget.type === 'top') {
        topIcon = iconClass;
        document.getElementById('btn-top-icon').innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
        document.getElementById('view-top-icon').innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
      } else if (pickerTarget.type === 'group') {
        orgData[pickerTarget.gIdx].icon = iconClass;
        renderEditor();
        renderChart();
      } else if (pickerTarget.type === 'item') {
        orgData[pickerTarget.gIdx].items[pickerTarget.iIdx].icon = iconClass;
        renderEditor();
        renderChart();
      }

      closeIconPicker();
    }

    // 渲染上方編輯器
    function renderEditor() {
      const editor = document.getElementById('groups-editor-container');
      editor.innerHTML = '';

      orgData.forEach((g, gIdx) => {
        const itemsEditHtml = g.items.map((item, iIdx) => `
          <div class="item-edit-row">
            <button class="icon-picker-btn" onclick="openIconPicker('item', ${gIdx}, ${iIdx})" title="點擊切換圖示">
              <i class="fa-solid ${item.icon}"></i>
            </button>
            <input type="text" class="item-text-input" value="${item.text}" oninput="updateItemText(${gIdx}, ${iIdx}, this.value)" placeholder="業務名稱">
            <button class="btn-del" onclick="deleteItem(${gIdx}, ${iIdx})" title="刪除細項">✕</button>
          </div>
        `).join('');

        editor.innerHTML += `
          <div class="group-edit-card">
            <strong>組別 ${gIdx + 1}</strong>
            <div class="group-edit-header">
              <button class="icon-picker-btn" onclick="openIconPicker('group', ${gIdx})" title="點擊更換組別大圖示">
                <i class="fa-solid ${g.icon}"></i>
              </button>
              <input type="text" class="name-input" value="${g.name}" oninput="updateGroupName(${gIdx}, this.value)" placeholder="組別名稱">
            </div>
            <input type="text" value="${g.en}" oninput="updateGroupEn(${gIdx}, this.value)" placeholder="英文名稱">
            
            <label style="font-size:11px; color:#64748b; margin-top:2px;">業務細項 (點左側按鈕挑選圖示)：</label>
            <div class="items-edit-container">
              ${itemsEditHtml}
            </div>
            <button class="btn-add-item" onclick="addItem(${gIdx})">➕ 新增細項</button>
          </div>
        `;
      });
    }

    // 渲染下方組織圖
    function renderChart() {
      const container = document.getElementById('groups-container');
      container.innerHTML = '';

      orgData.forEach(g => {
        const itemsHtml = g.items
          .filter(t => t.text.trim() !== '')
          .map(item => `
            <div class="item-row">
              <i class="fa-solid ${item.icon}"></i>
              <span>${item.text}</span>
            </div>
          `).join('');

        container.innerHTML += `
          <div class="group-card ${g.theme}">
            <div class="group-icon"><i class="fa-solid ${g.icon}"></i></div>
            <div class="group-header">
              <div class="group-header-badge">${g.name}</div>
              <div class="group-sub-title">${g.en}</div>
            </div>
            <div class="items-list">
              ${itemsHtml}
            </div>
          </div>
        `;
      });
    }

    function updateGroupName(gIdx, val) { orgData[gIdx].name = val; renderChart(); }
    function updateGroupEn(gIdx, val) { orgData[gIdx].en = val; renderChart(); }
    function updateItemText(gIdx, iIdx, val) { orgData[gIdx].items[iIdx].text = val; renderChart(); }

    function addItem(gIdx) {
      orgData[gIdx].items.push({ icon: 'fa-file-lines', text: '新業務項目' });
      renderEditor();
      renderChart();
    }

    function deleteItem(gIdx, iIdx) {
      orgData[gIdx].items.splice(iIdx, 1);
      renderEditor();
      renderChart();
    }

    function updateChart() {
      document.getElementById('view-top-name').textContent = document.getElementById('ipt-top-name').value;
      document.getElementById('view-top-en').textContent = `(${document.getElementById('ipt-top-en').value})`;
      document.getElementById('view-footer-text').textContent = document.getElementById('ipt-footer-text').value;
    }

    // 匯出高解析 PNG
    function exportToImage() {
      const chartElement = document.getElementById('org_chart');
      
      html2canvas(chartElement, {
        scale: 2.5,
        backgroundColor: '#ffffff',
        useCORS: true,
        scrollX: 0,
        scrollY: 0,
        windowWidth: 1200
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `組織架構圖_${new Date().toISOString().slice(0, 10)}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    window.onload = init;
  </script>
</body>
</html>
